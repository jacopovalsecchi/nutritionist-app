services:
  db:
    image: postgres:16-alpine
    container_name: nutritionist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutritionist
      POSTGRES_PASSWORD: nutritionist
      POSTGRES_DB: nutritionist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutritionist -d nutritionist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
